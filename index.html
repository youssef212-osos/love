<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سؤال مهم ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #020617;
            background-image: radial-gradient(circle at top left, #0f172a, #020617);
            color: #f8fafc;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 24px;
            padding: 32px 24px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 10;
        }

        .emoji-header {
            font-size: 54px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 23px;
            font-weight: 900;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .playground {
            position: relative;
            width: 100%;
            height: 150px;
            background: #020617;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow: hidden;
        }

        button {
            padding: 11px 26px;
            font-size: 17px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #yesBtn {
            background: #2563eb;
            color: white;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        #noBtn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 20;
            transition: left 0.12s ease-out, top 0.12s ease-out;
            white-space: nowrap;
        }

        .success-screen {
            display: none;
        }

        .song-box {
            background: #020617;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 16px;
            padding: 16px;
            margin-top: 12px;
        }

        .song-title {
            font-size: 15px;
            font-weight: 700;
            color: #7dd3fc;
            margin-bottom: 12px;
        }

        .yt-btn {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb, #38bdf8);
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            padding: 11px 22px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
        }

        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 4s linear forwards;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card" id="questionCard">
        <div class="emoji-header">🥺💙</div>
        <h1>إنتي بتحبيني زي ما أنا بحبك؟</h1>
        <p>جاوبي بصراحة.. مع إن مفيش غير إجابة واحدة 😉</p>
        
        <div class="playground" id="playground">
            <button type="button" id="yesBtn">آه ❤️</button>
            <button type="button" id="noBtn">لأ</button>
        </div>
    </div>

    <div class="card success-screen" id="successCard">
        <div class="emoji-header">🥰✨</div>
        <h1>وأنا بحبك أكتر بكتير 💙</h1>
        <p>كنت متأكد إنك مش هتعرفي تدوسي لأ أصلاً</p>
        
        <div class="song-box">
            <div class="song-title">🎵 TUL8TE - حبيبي ليه</div>
            <!-- حط لينك الأغنية المباشر من يوتيوب مكان اللينك ده لو حابب -->
            <a class="yt-btn" href="https://www.youtube.com/watch?v=MCbM1PwjA5Y">
                اسمعي الأغنية على يوتيوب ▶
            </a>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const playground = document.getElementById('playground');
        const questionCard = document.getElementById('questionCard');
        const successCard = document.getElementById('successCard');

        let yesScale = 1;
        let escapeCount = 0;

        const noTexts = [
            "متأكدة؟ 🤔",
            "حاولي تاني 😂",
            "مش هتلحقيني!",
            "دوسي آه وخلاص",
            "مفيش مفر 💙"
        ];

        function escapeInsideBox(e) {
            if (e) e.preventDefault();
            escapeCount++;

            noBtn.innerText = noTexts[(escapeCount - 1) % noTexts.length];

            if (yesScale < 1.35) {
                yesScale += 0.08;
                yesBtn.style.transform = `scale(${yesScale})`;
            }

            const boxWidth = playground.clientWidth;
            const boxHeight = playground.clientHeight;
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            const maxX = Math.max(8, boxWidth - btnWidth - 8);
            const maxY = Math.max(8, boxHeight - btnHeight - 8);

            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            noBtn.style.position = 'absolute';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', escapeInsideBox);
        noBtn.addEventListener('touchstart', escapeInsideBox, { passive: false });
        noBtn.addEventListener('click', escapeInsideBox);

        yesBtn.addEventListener('click', () => {
            questionCard.style.display = 'none';
            successCard.style.display = 'block';
            setInterval(createHeart, 250);
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            const emojis = ['💙', '✨', '🤍', '🥰', '❤️'];
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
